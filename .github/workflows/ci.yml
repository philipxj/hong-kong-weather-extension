name: CI

# Automatic CI temporarily disabled on 2026-08-03 to conserve GitHub Actions minutes.
# Run manually from the Actions tab only when needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
